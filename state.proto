syntax = "proto3";

package minecraftai;

option java_package = "me.sand.minecraftaimod.protobuf";
option java_multiple_files = true;

message Matrix3D {
  repeated Matrix matrix = 1;
}

message Matrix {
  repeated Row rows = 1;
}

message Row {
  repeated double values = 1;
}

message State {
  repeated double agentInfo = 1;
  Matrix inventory = 2;
  Matrix nearbyEntities = 3;
  Matrix3D nearbyBlocks = 4;
}

message Action {
  repeated float actions = 1;
}
